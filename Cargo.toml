[package]
name = "helios-opstack-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
alloy = "1.6.3"
kona-disc = { git = "https://github.com/op-rs/kona", rev = "2586fc56ea0b0f17a8b47c44196012e33a321ea7" }
kona-node-service = { git = "https://github.com/op-rs/kona", rev = "2586fc56ea0b0f17a8b47c44196012e33a321ea7" }
kona-registry = { git = "https://github.com/op-rs/kona", rev = "2586fc56ea0b0f17a8b47c44196012e33a321ea7" }
op-alloy-rpc-types-engine = "0.22.4"
ethereum_ssz = "0.9.1"

libp2p = { version = "0.56.0", features = ["macros", "tokio", "tcp", "noise", "gossipsub", "ping"] }
discv5 = "0.10.4"
tokio = { version = "1.44.2", features = ["full"] }
axum = "0.8.3"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.85"
clap = { version = "4.5.4", features = ["derive", "env"] }
